name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install "AstrBot>=4.28,<5" pytest ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: python -m pytest -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from pathlib import Path; from scripts.build_release import read_version; print(read_version(Path("metadata.yaml")))')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata version $version" >&2
            exit 1
          fi

      - name: Build and verify archive
        run: python scripts/build_release.py --output dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrbot_plugin_group_reply_gate-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "Release archive not found" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
